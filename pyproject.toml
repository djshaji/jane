[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jane-neural-engine"
version = "0.1.0"
description = "JANE offline cognitive foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.4"]

[project.scripts]
jane = "jane.cli:main"

[project.optional-dependencies]
openai = ["httpx==0.28.1"]
camera = ["Pillow==12.0.0", "opencv-python-headless==4.12.0.88"]
voice = ["httpx==0.28.1", "sounddevice==0.5.5"]
dev = ["ruff==0.14.3", "mypy==1.18.2", "build==1.3.0", "httpx==0.28.1", "Pillow==12.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jane.scenarios" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
