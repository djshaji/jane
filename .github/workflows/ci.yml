name: Offline foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: python -m unittest discover -s tests -v
      - run: python -m build --no-isolation
      - name: Install and exercise wheel outside source tree
        run: |
          python -m venv /tmp/jane-wheel
          /tmp/jane-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/jane-wheel/bin/jane --help
          /tmp/jane-wheel/bin/jane demo > jane-first.json
          /tmp/jane-wheel/bin/jane demo > jane-second.json
          cmp jane-first.json jane-second.json
