name: Offline foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: python -m unittest discover -s tests -v
      - run: python -m build --no-isolation
      - name: Install and exercise wheel outside source tree
        run: |
          python -m venv /tmp/jane-wheel
          /tmp/jane-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/jane-wheel/bin/jane --help
          /tmp/jane-wheel/bin/jane voice --help
          /tmp/jane-wheel/bin/jane camera --help
          /tmp/jane-wheel/bin/jane demo > jane-first.json
          /tmp/jane-wheel/bin/jane demo > jane-second.json
          cmp jane-first.json jane-second.json
          /tmp/jane-wheel/bin/jane coordinator-demo > coordinator-first.json
          /tmp/jane-wheel/bin/jane coordinator-demo > coordinator-second.json
          cmp coordinator-first.json coordinator-second.json
          /tmp/jane-wheel/bin/jane offline submit /tmp/jane-offline.db --text "Inspect simulated cup" --object cup
          /tmp/jane-wheel/bin/jane offline run /tmp/jane-offline.db > /tmp/jane-offline-trace.json
          /tmp/jane-wheel/bin/jane offline status /tmp/jane-offline.db > /tmp/jane-offline-status.json
          python -c 'import json; s=json.load(open("/tmp/jane-offline-status.json")); assert s["goals"][0]["status"] == "completed"'
